services:
  - type: web
    name: ace-logistics-backend
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://ace-app-dusky.vercel.app
      - key: FRONTEND_URL
        value: https://ace-app-dusky.vercel.app
